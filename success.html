<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment Successful</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #ffffff, #ff5fa2);
  }
  .box {
    background: #fff;
    border-radius: 24px;
    padding: 40px 32px;
    max-width: 320px;
    width: 90%;
    text-align: center;
  }
  h1 { margin: 0 0 8px; font-size: 28px; }
  p { color: #666; margin: 0 0 24px; }
  a {
    background: #ff5fa2;
    color: #fff;
    text-decoration: none;
    padding: 14px 32px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 16px;
  }
</style>
</head>
<body>
<div class="box">
  <h1>You're in! 🎉</h1>
  <p>Your subscription is active. Enjoy unlimited chat.</p>
  <a href="index.html">Start Chatting</a>
</div>
<script>
  // Mark as paid in localStorage when landing here
  const params = new URLSearchParams(window.location.search);
  const userId = params.get("userId");
  if (userId) {
    localStorage.setItem("isPaid", "true");
    localStorage.setItem("chatUserId", userId);
  }
</script>
</body>
</html>
